name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm test
      - run: npm run check
      - name: Linux UI checks
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run test:ui
      - name: Windows UI checks
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          npm run package:linux
          tar -czf dist/Digital-Journal-linux-x64.tar.gz -C dist 'Digital Journal-linux-x64'
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run package:windows
          Compress-Archive -Path 'dist/Digital Journal-win32-x64' -DestinationPath dist/Digital-Journal-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - working-directory: android
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-development-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
